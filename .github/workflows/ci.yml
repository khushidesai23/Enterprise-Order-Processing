name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: order_processing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d order_processing_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENABLE_DB_TESTS: "1"
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: "5432"
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres
      TEST_DB_NAME: order_processing_test
      TEST_DB_SSLMODE: disable
      TEST_RAZORPAY_KEY_ID: rzp_test_key
      TEST_RAZORPAY_KEY_SECRET: rzp_test_secret
      TEST_RAZORPAY_WEBHOOK_SECRET: rzp_test_webhook_secret
      TEST_JWT_SECRET: ci-test-jwt-secret
      APP_PORT: "8080"
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: order_processing_test
      DB_SSLMODE: disable
      JWT_SECRET: ci-unit-jwt-secret
      JWT_EXPIRATION: 1h
      RAZORPAY_KEY_ID: rzp_test_key
      RAZORPAY_KEY_SECRET: rzp_test_secret
      RAZORPAY_WEBHOOK_SECRET: rzp_test_webhook_secret
      OTEL_SERVICE_NAME: enterprise-order-processing-ci
      OTEL_SERVICE_VERSION: test
      OTEL_ENVIRONMENT: ci
      OTEL_EXPORTER_OTLP_ENDPOINT: localhost:4317

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          files="$(find . -name '*.go' -not -path './vendor/*')"
          unformatted="$(gofmt -l $files)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test ./...

      - name: Repository integration tests
        run: go test -tags=integration ./internal/repository

      - name: Order service integration tests
        run: go test -tags=integration ./internal/modules/order

      - name: HTTP end-to-end tests
        run: go test -tags=e2e ./internal/test/e2e/...
