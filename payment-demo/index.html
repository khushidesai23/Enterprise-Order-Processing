<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Enterprise Order Processing</title>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>

        body {

            font-family: Arial, sans-serif;

            max-width: 700px;

            margin: 50px auto;
        }

        h2 {

            margin-bottom: 20px;
        }

        input {

            width: 100%;

            padding: 10px;

            margin-bottom: 15px;
        }

        button {

            padding: 12px 20px;

            margin-right: 10px;

            cursor: pointer;
        }

        #status {

            margin-top: 20px;

            color: green;

            font-weight: bold;
        }

    </style>

</head>

<body>

<h2>Enterprise Order Processing</h2>

<hr>

<h3>Login</h3>

<input
        id="email"
        placeholder="Email"
/>

<input
        id="password"
        type="password"
        placeholder="Password"
/>

<button onclick="login()">

    Login

</button>

<hr>

<h3>Payment</h3>

<input
        id="orderId"
        placeholder="Order UUID"
/>

<button onclick="payNow()">

    Pay Now

</button>

<div id="status"></div>

<script src="app.js"></script>

</body>

</html>
