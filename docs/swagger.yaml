basePath: /api/v1
definitions:
  github_com_khushidesai23_Enterprise-Order-Processing_internal_api_response.APIResponse:
    properties:
      data: {}
      error:
        type: string
      message:
        type: string
      success:
        type: boolean
      timestamp:
        type: string
    type: object
  github_com_khushidesai23_Enterprise-Order-Processing_internal_models.OrderStatus:
    enum:
    - CREATED
    - PAYMENT_PENDING
    - PAID
    - PACKED
    - SHIPPED
    - DELIVERED
    - CANCELLED
    type: string
    x-enum-varnames:
    - OrderCreated
    - OrderPaymentPending
    - OrderPaid
    - OrderPacked
    - OrderShipped
    - OrderDelivered
    - OrderCancelled
  github_com_khushidesai23_Enterprise-Order-Processing_internal_models.ProductSpec:
    properties:
      name:
        type: string
      value:
        type: string
    type: object
  github_com_khushidesai23_Enterprise-Order-Processing_internal_models.Role:
    enum:
    - customer
    - admin
    type: string
    x-enum-varnames:
    - RoleCustomer
    - RoleAdmin
  internal_modules_auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_modules_category.CreateCategoryRequest:
    properties:
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - name
    type: object
  internal_modules_category.UpdateCategoryRequest:
    properties:
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - name
    type: object
  internal_modules_inventory.CreateInventoryRequest:
    properties:
      available_quantity:
        minimum: 0
        type: integer
      product_id:
        type: string
    required:
    - product_id
    type: object
  internal_modules_inventory.StockOperationRequest:
    properties:
      quantity:
        type: integer
    required:
    - quantity
    type: object
  internal_modules_inventory.UpdateInventoryRequest:
    properties:
      available_quantity:
        minimum: 0
        type: integer
      reserved_quantity:
        minimum: 0
        type: integer
    type: object
  internal_modules_order.CreateOrderItemRequest:
    properties:
      product_id:
        type: string
      quantity:
        type: integer
    required:
    - product_id
    - quantity
    type: object
  internal_modules_order.CreateOrderRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_modules_order.CreateOrderItemRequest'
        minItems: 1
        type: array
    required:
    - items
    type: object
  internal_modules_order.UpdateOrderStatusRequest:
    properties:
      status:
        $ref: '#/definitions/github_com_khushidesai23_Enterprise-Order-Processing_internal_models.OrderStatus'
    required:
    - status
    type: object
  internal_modules_payment.CreatePaymentRequest:
    properties:
      order_id:
        type: string
    required:
    - order_id
    type: object
  internal_modules_payment.ProcessWebhookRequest:
    properties:
      body:
        items:
          format: int32
          type: integer
        type: array
      eventID:
        type: string
      signature:
        type: string
    type: object
  internal_modules_payment.VerifyPaymentRequest:
    properties:
      razorpay_order_id:
        type: string
      razorpay_payment_id:
        type: string
      razorpay_signature:
        type: string
    required:
    - razorpay_order_id
    - razorpay_payment_id
    - razorpay_signature
    type: object
  internal_modules_product.CreateProductRequest:
    properties:
      brand:
        description: Optional catalogue details.
        maxLength: 100
        type: string
      category_id:
        type: string
      description:
        maxLength: 1000
        type: string
      image_url:
        maxLength: 500
        type: string
      images:
        items:
          type: string
        maxItems: 10
        type: array
      mrp:
        minimum: 0
        type: number
      name:
        maxLength: 255
        minLength: 2
        type: string
      price:
        type: number
      sku:
        maxLength: 100
        minLength: 2
        type: string
      specs:
        items:
          $ref: '#/definitions/github_com_khushidesai23_Enterprise-Order-Processing_internal_models.ProductSpec'
        maxItems: 30
        type: array
    required:
    - category_id
    - name
    - price
    - sku
    type: object
  internal_modules_product.UpdateProductRequest:
    properties:
      brand:
        maxLength: 100
        type: string
      category_id:
        type: string
      description:
        maxLength: 1000
        type: string
      image_url:
        maxLength: 500
        type: string
      images:
        items:
          type: string
        maxItems: 10
        type: array
      mrp:
        minimum: 0
        type: number
      name:
        maxLength: 255
        minLength: 2
        type: string
      price:
        type: number
      sku:
        maxLength: 100
        minLength: 2
        type: string
      specs:
        items:
          $ref: '#/definitions/github_com_khushidesai23_Enterprise-Order-Processing_internal_models.ProductSpec'
        maxItems: 30
        type: array
    required:
    - category_id
    - name
    - price
    - sku
    type: object
  internal_modules_review.UpsertReviewRequest:
    properties:
      body:
        maxLength: 4000
        type: string
      rating:
        maximum: 5
        minimum: 1
        type: integer
      title:
        maxLength: 150
        type: string
    required:
    - rating
    type: object
  internal_modules_user.CreateUserRequest:
    properties:
      email:
        type: string
      first_name:
        maxLength: 100
        minLength: 2
        type: string
      last_name:
        maxLength: 100
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - first_name
    - password
    type: object
  internal_modules_user.UpdateUserRequest:
    properties:
      first_name:
        type: string
      is_active:
        type: boolean
      last_name:
        type: string
    type: object
  internal_modules_user.UpdateUserRoleRequest:
    properties:
      role:
        $ref: '#/definitions/github_com_khushidesai23_Enterprise-Order-Processing_internal_models.Role'
    required:
    - role
    type: object
