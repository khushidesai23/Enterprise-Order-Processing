  /orders/{id}/cancel:
    patch:
      consumes:
      - application/json
      description: Cancel an unpaid order and release its stock (own orders only,
        unless admin). Paid orders are cancelled by refunding the payment.
      parameters:
      - description: Order ID
        in: path
