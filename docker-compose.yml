services:
  postgres:
    image: postgres:16
    container_name: order-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: order-jaeger
    restart: unless-stopped

    ports:
      - "16686:16686"

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: order-otel-collector
    restart: unless-stopped

    command:
      - "--config=/etc/otelcol/config.yaml"

    volumes:
      - ./config/collector-config.yaml:/etc/otelcol/config.yaml:ro

    ports:
      - "4317:4317"
      - "4318:4318"

    depends_on:
      - jaeger

volumes:
  postgres_data: