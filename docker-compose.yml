services:
  postgres:
    image: postgres:16
    container_name: order-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: order-jaeger
    restart: unless-stopped

    ports:
      - "16686:16686"

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: order-otel-collector
    restart: unless-stopped

    command:
      - "--config=/etc/otelcol/config.yaml"

    volumes:
      - ./config/collector-config.yaml:/etc/otelcol/config.yaml:ro

    ports:
      - "4317:4317"
      - "4318:4318"

    depends_on:
      - jaeger

  postgres-test:
    image: postgres:16
    container_name: order-postgres-test
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${TEST_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${TEST_DB_NAME:-order_processing_test}

    ports:
      - "${TEST_DB_PORT:-5433}:5432"

    volumes:
      - postgres_test_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_DB_USER:-postgres} -d ${TEST_DB_NAME:-order_processing_test}"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: order-prometheus
    restart: unless-stopped

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    ports:
      - "9090:9090"

    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: order-grafana
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro

    depends_on:
      - prometheus

volumes:
  postgres_data:
  postgres_test_data:
  prometheus_data:
  grafana_data:
